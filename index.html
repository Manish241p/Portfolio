<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manish Parmar | PHP Laravel & WordPress Developer</title>
<meta name="description" content="Explore the portfolio of Manish Parmar, a PHP Laravel and WordPress developer in Rajkot, Gujarat. View web projects, custom plugins, technical skills and contact information.">
<meta name="theme-color" content="#0B0F19">
<meta property="og:title" content="Manish Parmar | PHP Laravel & WordPress Developer">
<meta property="og:description" content="PHP Laravel and WordPress developer in Rajkot, Gujarat. Websites, custom plugins and theme development.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231683FF'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' text-anchor='middle' fill='white'%3EMP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0B0F19; --bg2:#101827; --card:#151C2C; --blue:#1683FF; --blue2:#4BA2FF;
  --text:#F5F7FA; --muted:#A7B0C0; --line:#273449;
  --r-lg:26px; --r-md:16px; --r-sm:10px;
  --head:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hh:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 16px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
ul{list-style:none}
:focus-visible{outline:2px solid var(--blue2);outline-offset:3px;border-radius:6px}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--blue)}

.wrap{width:min(1180px,100% - 48px);margin-inline:auto}
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,h4{font-family:var(--head);line-height:1.1;letter-spacing:-.02em;font-weight:600}
.muted{color:var(--muted)}

/* ambient background */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 500px at 82% -8%,rgba(22,131,255,.16),transparent 60%),
  radial-gradient(700px 500px at -10% 40%,rgba(22,131,255,.08),transparent 60%),
  var(--bg)}
.ambient::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000,transparent 75%)}
#cursorGlow{position:fixed;width:520px;height:520px;border-radius:50%;left:0;top:0;pointer-events:none;z-index:-1;background:radial-gradient(circle,rgba(22,131,255,.10),transparent 65%);transform:translate(-50%,-50%);transition:opacity .4s;opacity:0}

/* progress bars */
#scrollBar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--blue),var(--blue2));z-index:200}
#routeBar{position:fixed;top:0;left:0;height:2px;width:100%;transform:scaleX(0);transform-origin:left;background:var(--blue2);z-index:201;opacity:0}
#routeBar.go{animation:routeSweep .7s cubic-bezier(.7,0,.2,1)}
@keyframes routeSweep{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}

/* header */
header.site{position:fixed;inset:0 0 auto 0;height:var(--hh);z-index:100;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.site.stuck{background:rgba(11,15,25,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.hbar{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-family:var(--head);font-weight:700;font-size:1.2rem;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-style:normal;font-size:.8rem;letter-spacing:0;box-shadow:0 0 24px rgba(22,131,255,.45)}
.brand b{font-weight:700;color:var(--blue2)}
nav.main ul{display:flex;gap:2px;align-items:center}
nav.main a{padding:8px 12px;border-radius:999px;color:var(--muted);font-size:.9rem;font-weight:500;transition:color .2s,background .2s;position:relative}
nav.main a:hover{color:var(--text);background:rgba(255,255,255,.05)}
nav.main a.active{color:var(--text)}
nav.main a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--blue)}
.hbar .right{display:flex;align-items:center;gap:10px}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;place-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:.95rem;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn .ico{transition:transform .25s}
.btn:hover .ico.go{transform:translateX(4px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 28px -8px rgba(22,131,255,.7)}
.btn-primary:hover{background:var(--blue2);transform:translateY(-2px)}
.btn-ghost{border-color:var(--line);background:rgba(21,28,44,.6)}
.btn-ghost:hover{border-color:var(--blue2);transform:translateY(-2px)}
.btn-sm{padding:9px 18px;font-size:.88rem}

/* main + page transition */
main{flex:1;padding-top:var(--hh)}
main.enter>*{animation:pageIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

section.s{padding:96px 0}
section.alt{background:linear-gradient(180deg,transparent,rgba(16,24,39,.7) 15%,rgba(16,24,39,.7) 85%,transparent)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:44px;flex-wrap:wrap}
.sh h2{font-size:clamp(1.9rem,3.6vw,2.9rem);max-width:720px}
.sh p{color:var(--muted);max-width:560px;margin-top:14px}
.link-arrow{display:inline-flex;align-items:center;gap:8px;color:var(--blue2);font-weight:600;font-size:.95rem}
.link-arrow:hover .ico{transform:translateX(4px)}
.link-arrow .ico{transition:transform .25s}

/* page hero (inner pages) */
.phero{padding:84px 0 40px}
.crumbs{display:flex;gap:8px;font-size:.85rem;color:var(--muted);margin-bottom:22px;flex-wrap:wrap}
.crumbs a:hover{color:var(--blue2)}
.phero h1{font-size:clamp(2.4rem,6vw,4.4rem);max-width:900px}
.phero p.lead{font-size:1.15rem;color:var(--muted);max-width:640px;margin-top:22px}

/* cards with spotlight */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:28px;transition:border-color .3s,transform .3s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx,50%) var(--my,0%),rgba(22,131,255,.16),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{border-color:rgba(75,162,255,.55)}
.card:hover::before{opacity:1}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

/* HERO */
.hero{padding:70px 0 90px;min-height:calc(100vh - var(--hh));display:flex;align-items:center}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(21,28,44,.7);font-size:.8rem;letter-spacing:.14em;color:var(--blue2);font-weight:600}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:#2ee59d;box-shadow:0 0 0 0 rgba(46,229,157,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(46,229,157,0)}100%{box-shadow:0 0 0 0 rgba(46,229,157,0)}}
.hero h1{font-size:clamp(2.7rem,5.6vw,4.9rem);margin:26px 0 24px;letter-spacing:-.035em;line-height:1.02}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.hero h1 .w span{display:inline-block;transform:translateY(110%);animation:wordUp .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.09s + .15s)}
@keyframes wordUp{to{transform:none}}
.hero .sub{font-size:1.15rem;color:var(--muted);max-width:560px}
.hero .cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:38px}
.hero .socials{display:flex;gap:12px;margin-top:34px;align-items:center;color:var(--muted);font-size:.9rem}
.soc{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.25s;background:rgba(21,28,44,.6)}
.soc:hover{border-color:var(--blue2);color:var(--blue2);transform:translateY(-3px)}

.portrait{position:relative;max-width:440px;margin-left:auto;width:100%}
.portrait .ring{position:absolute;inset:-2px;border-radius:34px;background:conic-gradient(from var(--a,0deg),transparent 0 55%,var(--blue) 80%,var(--blue2) 90%,transparent);animation:spin 7s linear infinite;filter:blur(.3px)}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.portrait .glow{position:absolute;inset:8% -12% -6% -12%;background:radial-gradient(closest-side,rgba(22,131,255,.35),transparent);filter:blur(30px);z-index:-1}
.frame{position:relative;border-radius:32px;overflow:hidden;aspect-ratio:4/5;background:var(--card);border:1px solid var(--line);margin:2px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.monogram{position:absolute;inset:0;display:grid;place-items:center;font:700 6rem var(--head);color:var(--blue2);background:linear-gradient(160deg,#17233b,#0e1524)}
.chip{position:absolute;display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:rgba(16,24,39,.92);border:1px solid var(--line);font-size:.82rem;font-weight:600;box-shadow:0 12px 30px -12px #000;backdrop-filter:blur(8px);animation:floaty 6s ease-in-out infinite}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.chip.c1{top:9%;left:-34px}.chip.c2{top:44%;right:-30px;animation-delay:-2s}.chip.c3{bottom:20%;left:-26px;animation-delay:-4s}
@keyframes floaty{50%{transform:translateY(-9px)}}
.term{position:absolute;right:-18px;bottom:-34px;width:min(310px,82%);background:#0a0f1a;border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 60px -20px #000;font:500 .78rem/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
.term .tb{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:#0d1424}
.term .tb s{width:9px;height:9px;border-radius:50%;background:#2a3650;display:block}
.term pre{padding:12px 14px;min-height:96px;white-space:pre-wrap;color:#c6d3ea;font:inherit}
.term .p{color:var(--blue2)}.term .ok{color:#2ee59d}
.term .caret{display:inline-block;width:7px;height:1em;background:var(--blue2);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* shot overlay */
.shot .ov{position:absolute;inset:30px 0 0 0;z-index:3;display:grid;place-items:end center;padding-bottom:18px;background:linear-gradient(180deg,transparent 40%,rgba(11,15,25,.85));opacity:0;transition:opacity .35s}
.shot .ov span{display:inline-flex;gap:8px;align-items:center;padding:9px 18px;border-radius:99px;background:var(--blue);color:#fff;font-weight:600;font-size:.85rem;transform:translateY(10px);transition:transform .35s}
.shot:hover .ov,.shot .ov:focus-visible{opacity:1}
.shot:hover .ov span,.shot .ov:focus-visible span{transform:none}

/* showcase */
.show{display:grid;grid-template-columns:300px 1fr;gap:32px;align-items:start}
.show-list{display:grid;gap:8px}
.show-tab{position:relative;overflow:hidden;text-align:left;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:background .25s,border-color .25s}
.show-tab strong{font:600 1.02rem var(--head)}
.show-tab span{font-size:.8rem;color:var(--muted)}
.show-tab:hover{border-color:#3a5078}
.show-tab[aria-selected=true]{background:var(--card);border-color:var(--blue2)}
.show-tab::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--blue2)}
.show-tab.run::after{animation:fill 5.2s linear forwards}
.show:hover .show-tab.run::after{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.show-stage{display:grid}
.show-panel{grid-area:1/1;opacity:0;visibility:hidden;transform:translateY(14px) scale(.985);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1),visibility .6s}
.show-panel.on{opacity:1;visibility:visible;transform:none}
.show-panel .shot{border-radius:20px;border:1px solid var(--line);box-shadow:0 50px 90px -40px rgba(22,131,255,.55)}
.show-info{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;margin-top:22px}
.show-info h3{font-size:1.7rem}.show-info p{color:var(--muted);max-width:480px;margin-top:6px}

/* about portrait */
.about-photo{position:relative;max-width:400px;margin-left:auto;width:100%}
.about-photo::before{content:"";position:absolute;inset:22px -18px -18px 22px;border:1px solid var(--blue);border-radius:32px;opacity:.55}
.about-photo .frame{margin:0}
.about-photo .badge{position:absolute;left:-22px;bottom:34px;background:rgba(16,24,39,.94);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:0 20px 40px -16px #000}
.about-photo .badge b{display:block;font:600 1rem var(--head)}
.about-photo .badge small{color:var(--muted)}

/* marquee */
.marq{border-block:1px solid var(--line);background:rgba(16,24,39,.6);overflow:hidden;padding:20px 0;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq .track{display:flex;gap:52px;width:max-content;animation:marq 32s linear infinite}
.marq span{font:600 1.15rem var(--head);color:var(--muted);display:flex;align-items:center;gap:52px;white-space:nowrap}
.marq span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
@keyframes marq{to{transform:translateX(-50%)}}

/* intro */
.intro{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.intro h2{font-size:clamp(1.9rem,3.6vw,2.9rem)}
.intro p+p{margin-top:18px}
.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:30px}
.pillar{padding:18px;border:1px solid var(--line);border-radius:var(--r-md);background:rgba(21,28,44,.5)}
.pillar h4{font-size:1rem;margin:10px 0 4px}
.pillar p{font-size:.88rem;color:var(--muted);margin:0!important}
.pillar .ico{color:var(--blue2);font-size:1.4rem}

/* project cards */
.pcard{padding:0;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,#142038,#0c1424);border-bottom:1px solid var(--line)}
.shot .bar{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(11,15,25,.88);display:flex;align-items:center;gap:6px;padding:0 12px;z-index:2;font-size:.7rem;color:var(--muted)}
.shot .bar s{width:8px;height:8px;border-radius:50%;background:#2a3650;display:block}
.shot .bar em{margin-left:10px;font-style:normal;background:#0b0f19;padding:2px 12px;border-radius:99px;flex:1;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot .fb{position:absolute;inset:0;display:grid;place-items:center;font:700 3.6rem var(--head);color:rgba(75,162,255,.35)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .shot img{transform:scale(1.05)}
.pbody{padding:24px 26px 26px;display:flex;flex-direction:column;gap:12px;flex:1}
.cat{font-size:.82rem;color:var(--blue2);font-weight:600}
.pbody h3{font-size:1.4rem}
.pbody p{color:var(--muted);font-size:.94rem}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;color:var(--muted);background:rgba(11,15,25,.5)}
.actions{display:flex;gap:18px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.fbtn{padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-weight:500;font-size:.9rem;transition:.2s}
.fbtn:hover{color:var(--text);border-color:var(--blue2)}
.fbtn[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}

/* plugins */
.plug{display:flex;flex-direction:column;gap:14px;min-height:100%}
.plug .top{display:flex;justify-content:space-between;align-items:center}
.plug .pi{width:50px;height:50px;border-radius:14px;background:rgba(22,131,255,.12);color:var(--blue2);display:grid;place-items:center;font-size:1.5rem;border:1px solid rgba(22,131,255,.3)}
.ver{font:500 .78rem ui-monospace,Menlo,Consolas,monospace;color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.plug h3{font-size:1.4rem}
.plug p{color:var(--muted);font-size:.94rem}

/* feature list */
.flist{display:grid;gap:12px}
.flist li{display:flex;gap:12px;align-items:flex-start;color:var(--text);font-size:.96rem}
.flist .ico{color:var(--blue2);margin-top:.28em}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:start}
.panel{border:1px dashed #34466a;border-radius:var(--r-md);padding:30px;background:rgba(16,24,39,.6);display:grid;place-items:center;text-align:center;min-height:260px;gap:12px;color:var(--muted)}
.panel .ico{font-size:2.2rem;color:var(--blue2)}
.note{display:flex;gap:14px;padding:18px 20px;border:1px solid rgba(75,162,255,.35);background:rgba(22,131,255,.07);border-radius:var(--r-md);font-size:.92rem;color:#cfe0f7}
.note .ico{color:var(--blue2);margin-top:.2em;font-size:1.2em}
.kv{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--card)}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:.92rem}
.kv div:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right}

/* skills */
.skill{display:flex;flex-direction:column;gap:12px}
.skill .si{font-size:1.6rem;color:var(--blue2)}
.skill h3{font-size:1.25rem}
.skill ul{display:flex;flex-wrap:wrap;gap:8px}
.skill li{padding:5px 13px;border-radius:99px;background:rgba(22,131,255,.1);border:1px solid rgba(22,131,255,.25);font-size:.84rem;color:#cfe0f7}
.skill p{color:var(--muted);font-size:.92rem}

/* timeline */
.tl{position:relative;padding-left:34px;border-left:1px solid var(--line);margin-left:8px}
.tl .it{position:relative;padding-bottom:10px}
.tl .it::before{content:"";position:absolute;left:-41px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 6px rgba(22,131,255,.18)}
.tl h3{font-size:1.5rem}
.when{color:var(--blue2);font-weight:600;font-size:.9rem;margin:6px 0 14px;display:block}

/* steps */
.step{display:flex;flex-direction:column;gap:10px}
.step .n{font:700 2.4rem var(--head);color:var(--blue);line-height:1}
.step h3{font-size:1.2rem}.step p{color:var(--muted);font-size:.92rem}

/* service */
.svc{display:flex;flex-direction:column;gap:12px}
.svc .si{width:46px;height:46px;border-radius:13px;background:rgba(22,131,255,.12);color:var(--blue2);display:grid;place-items:center;font-size:1.35rem;border:1px solid rgba(22,131,255,.28)}
.svc h3{font-size:1.2rem}.svc p{color:var(--muted);font-size:.92rem}
.svc ul{display:grid;gap:6px;font-size:.86rem;color:#cfd8e8}
.svc ul li::before{content:"–";color:var(--blue2);margin-right:8px}
.svc .link-arrow{margin-top:auto;padding-top:8px}

/* CTA */
.cta-box{position:relative;border:1px solid var(--line);border-radius:36px;padding:72px 40px;text-align:center;overflow:hidden;background:linear-gradient(160deg,#15213a,#0e1524)}
.cta-box::before{content:"";position:absolute;width:560px;height:560px;left:50%;top:-340px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(22,131,255,.5),transparent);filter:blur(10px)}
.cta-box>*{position:relative}
.cta-box h2{font-size:clamp(2rem,4.5vw,3.4rem);max-width:700px;margin:0 auto 18px}
.cta-box p{color:var(--muted);max-width:520px;margin:0 auto 34px}
.cta-box .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* contact */
.cgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;align-items:start}
.clist{display:grid;gap:14px}
.clink{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);transition:.25s}
a.clink:hover{border-color:var(--blue2);transform:translateX(4px)}
.clink .ico{font-size:1.4rem;color:var(--blue2)}
.clink small{display:block;color:var(--muted);font-size:.78rem}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fld{display:grid;gap:8px}.fld.full{grid-column:1/-1}
.fld label{font-size:.86rem;font-weight:500;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);transition:border-color .2s,box-shadow .2s}
.fld select option{background:var(--bg2)}
.fld textarea{min-height:150px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 4px rgba(22,131,255,.18)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:#ff6b7a}
.err{color:#ff8f9b;font-size:.8rem;min-height:0}
.hp{position:absolute;left:-9999px;opacity:0}
#formMsg{grid-column:1/-1}

/* footer */
footer.site{border-top:1px solid var(--line);background:rgba(11,15,25,.9);padding:72px 0 28px;margin-top:40px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.fgrid h4{font-size:.95rem;margin-bottom:18px}
.fgrid li{margin-bottom:10px}
.fgrid a{color:var(--muted);font-size:.92rem;transition:color .2s}
.fgrid a:hover{color:var(--blue2)}
.fgrid p{color:var(--muted);font-size:.92rem;margin-top:16px;max-width:320px}
.fbot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:54px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem;flex-wrap:wrap}
.totop{display:inline-flex;gap:8px;align-items:center;color:var(--blue2);font-weight:600;cursor:pointer;background:none;border:0}
.totop .ico{transform:rotate(-90deg)}

/* 404 */
.nf{min-height:60vh;display:grid;place-items:center;text-align:center;padding:60px 0}
.nf h1{font-size:clamp(5rem,16vw,11rem);color:var(--blue);letter-spacing:-.05em}

/* reveal */
[data-r]{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform .8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
[data-r].in{opacity:1;transform:none}


/* ===== v3 additions ===== */
.mobile-hire{display:none}
nav.main a{padding:8px 10px;font-size:.88rem}
.cmd span{display:none}.cmd kbd{white-space:nowrap}
.hbar{gap:12px}
.portrait{transition:transform .25s ease-out;will-change:transform}
.frame::after{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--gx,30%) var(--gy,15%),rgba(255,255,255,.13),transparent 60%);pointer-events:none}
.hero{position:relative}
.wm{position:absolute;right:-6px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font:700 clamp(6rem,11vw,10rem)/1 var(--head);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px rgba(75,162,255,.16);pointer-events:none;user-select:none;z-index:-1}
.clock{display:flex;align-items:center;gap:10px;margin-top:30px;color:var(--muted);font-size:.9rem}
.clock .ico{color:var(--blue2)}
.clock b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.marq .track.out{margin-top:14px;animation-direction:reverse;animation-duration:44s}
.marq .track.out span{font-size:1.9rem;color:transparent;-webkit-text-stroke:1px #3b5176}
.marq{padding:26px 0}
.statement{font:600 clamp(1.7rem,4.2vw,3.5rem)/1.2 var(--head);letter-spacing:-.025em;max-width:1000px}
.statement span{opacity:.16;transition:opacity .35s,color .35s}
.statement span.on{opacity:1}
.statement span.hl.on{color:var(--blue2)}
.bigword{font:700 clamp(2rem,9vw,9rem)/.95 var(--head);letter-spacing:-.05em;text-align:center;margin-top:56px;background:linear-gradient(180deg,rgba(75,162,255,.42),rgba(75,162,255,0) 88%);-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none;white-space:nowrap;overflow:hidden}
.cmd{display:inline-flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(21,28,44,.6);color:var(--muted);font-size:.85rem;cursor:pointer;transition:border-color .2s,color .2s}
.cmd:hover{border-color:var(--blue2);color:var(--text)}
.cmd kbd,.pal-in kbd{font:500 .72rem ui-monospace,Menlo,Consolas,monospace;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
#pal{position:fixed;inset:0;z-index:400;background:rgba(5,8,15,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:flex-start;padding:13vh 16px 0}
#pal[hidden]{display:none}
.pal-box{width:min(640px,100%);background:var(--bg2);border:1px solid #34466a;border-radius:20px;box-shadow:0 40px 100px -20px #000,0 0 0 1px rgba(22,131,255,.12);overflow:hidden;animation:palIn .25s cubic-bezier(.2,.8,.2,1)}
@keyframes palIn{from{opacity:0;transform:translateY(-12px) scale(.98)}}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-in input{flex:1;background:none;border:0;outline:0;font-size:1.05rem;color:var(--text)}
#palList{max-height:min(52vh,420px);overflow:auto;padding:8px}
#palList li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;cursor:pointer;font-size:.96rem}
#palList li small{color:var(--muted);font-size:.78rem}
#palList li[aria-selected=true]{background:rgba(22,131,255,.16);color:#fff}
#palList .none{color:var(--muted);cursor:default;justify-content:center;padding:26px}
.ide{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#0a0f1a;box-shadow:0 50px 100px -50px rgba(22,131,255,.5)}
.ide-top{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#0d1424;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.ide-top s{width:11px;height:11px;border-radius:50%;background:#2a3650;display:block}
.ide-top span{margin-left:12px}
.ide-body{display:grid;grid-template-columns:230px 1fr;min-height:360px}
.ide-side{border-right:1px solid var(--line);padding:16px 10px;background:#0b111e;display:flex;flex-direction:column;gap:2px}
.ide-side p{font-size:.72rem;letter-spacing:.12em;color:#5b6b86;padding:0 10px 10px}
.ide-side button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--muted);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font:500 .88rem ui-monospace,Menlo,Consolas,monospace;transition:.2s}
.ide-side button:hover{color:var(--text);background:rgba(255,255,255,.04)}
.ide-side button[aria-selected=true]{background:rgba(22,131,255,.16);color:#fff}
.ide-code{padding:22px 0;font:500 .92rem/1.9 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#c6d3ea;overflow:auto}
.ide-code div{display:flex;white-space:pre;padding-right:24px}
.ide-code i{font-style:normal;width:46px;flex:none;text-align:right;padding-right:20px;color:#3d4c68;user-select:none}
.ide-code .k{color:#8fb8ff}.ide-code .s{color:#7ee0b5}.ide-code .c{color:#5b6b86}
.ide-code .caret{display:inline-block;width:8px;height:1.1em;background:var(--blue2);vertical-align:-3px;animation:blink 1s steps(2) infinite}
.ide-stat{display:flex;justify-content:space-between;padding:8px 16px;background:var(--blue);color:#fff;font-size:.75rem}
@media (max-width:980px){.wm{display:none}.ide-body{grid-template-columns:1fr}.ide-side{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.ide-side p{display:none}.ide-side button{white-space:nowrap}}
@media (max-width:640px){.cmd span,.cmd kbd{display:none}.cmd{padding:10px 12px}}

/* responsive */
@media (max-width:1180px){
  .mobile-hire{display:block}
  nav.main a{padding:16px 12px;font-size:1.25rem}
  nav.main{position:fixed;inset:var(--hh) 0 0 0;background:rgba(11,15,25,.98);padding:28px 24px;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);overflow:auto;visibility:hidden}
  nav.main.open{transform:none;visibility:visible}
  nav.main ul{flex-direction:column;align-items:stretch;gap:4px}
  nav.main a{display:block;font-size:1.25rem;font-family:var(--head);padding:16px 12px;border-radius:12px;border-bottom:1px solid var(--line)}
  nav.main a.active::after{display:none}
  nav.main a.active{color:var(--blue2)}
  .burger{display:grid}
  .hbar .btn{display:none}
}
@media (max-width:980px){
  .hero .wrap,.intro,.two,.cgrid,.show{grid-template-columns:1fr}
  .show-list{display:flex;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .show-tab{flex:0 0 200px}
  .about-photo{margin:20px auto 30px;max-width:340px}
  .hero{padding-top:30px}
  .portrait{margin:20px auto 40px;max-width:360px}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr 1fr}
  section.s{padding:72px 0}
}
@media (max-width:640px){
  .wrap{width:min(1180px,100% - 32px)}
  .g2,.g3,.g4,.pillars,form.f{grid-template-columns:1fr}
  .chip.c1,.chip.c3{left:-8px}.chip.c2{right:-8px}.term{right:-6px}
  .fgrid{grid-template-columns:1fr}
  .cta-box{padding:56px 22px}
  .hero .cta .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  [data-r]{opacity:1;transform:none}
  .hero h1 .w span{transform:none}
}
</style>

  };
  const open=()=>{prev=document.activeElement;pal.hidden=false;inp.value='';idx=0;draw();inp.focus();document.body.style.overflow='hidden'};
  const close=()=>{pal.hidden=true;document.body.style.overflow=nav.classList.contains('open')?'hidden':'';prev&&prev.focus&&prev.focus()};

  inp.addEventListener('input',()=>{idx=0;draw()});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();idx=(idx+1)%Math.max(cur.length,1);draw()}
    else if(e.key==='ArrowUp'){e.preventDefault();idx=(idx-1+cur.length)%Math.max(cur.length,1);draw()}

  const msg=$('#formMsg');
  const setErr=(el,t)=>{const f=el.closest('.fld');f.classList.toggle('bad',!!t);const s=$('.err',f);if(s)s.textContent=t||''};
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(form));
    if(d.website)return; // honeypot
    let ok=true;
    const n=form.elements.name,em=form.elements.email,su=form.elements.subject,m=form.elements.message;
    const clean=s=>s.replace(/\s+/g,' ').trim();
    setErr(n,clean(n.value).length<2?(ok=false,'Enter your full name.'):'');
    setErr(em,/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim())?'':(ok=false,'Enter a valid email address, like name@example.com.'));
    setErr(su,clean(su.value).length<3?(ok=false,'Enter a short subject.'):'');
    setErr(m,m.value.trim().length<10?(ok=false,'Write at least 10 characters so I understand your project.'):'');
    if(!ok){msg.innerHTML='';const first=$('.fld.bad input,.fld.bad textarea',form);first&&first.focus();return}
    if(!CONFIG.email){
      msg.innerHTML=`<div class="note">${ic('info')}<div><strong>Email isn't set up yet.</strong> Add your address to <code>CONFIG.email</code> at the top of the script so this form can open a ready-to-send email.</div></div>`;return;
    }
    const body=`Name: ${clean(d.name)}\nEmail: ${d.email.trim()}\nCategory: ${d.cat}\nBudget: ${d.budget||'Not specified'}\n\n${d.message.trim()}`;
    location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent(clean(d.subject))}&body=${encodeURIComponent(body)}`;
    msg.innerHTML=`<div class="note">${ic('check')}<div><strong>Your email app should open now.</strong> Press send there to deliver your message.</div></div>`;
  });
  $$('input,textarea',form).forEach(i=>i.addEventListener('input',()=>setErr(i,'')));
}

/* ---------- Global UI ---------- */
const header=$('#header'),burger=$('#burger'),nav=$('#nav');
burger.innerHTML=ic('menu');
function closeMenu(){nav.classList.remove('open');burger.setAttribute('aria-expanded','false');burger.setAttribute('aria-label','Open menu');burger.innerHTML=ic('menu');document.body.style.overflow=''}
burger.onclick=()=>{
  const open=!nav.classList.contains('open');
  nav.classList.toggle('open',open);burger.setAttribute('aria-expanded',open);burger.setAttribute('aria-label',open?'Close menu':'Open menu');burger.innerHTML=ic(open?'x':'menu');document.body.style.overflow=open?'hidden':'';
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&nav.classList.contains('open')){closeMenu();burger.focus()}});
matchMedia('(min-width:1181px)').addEventListener('change',closeMenu);

const sb=$('#scrollBar');
addEventListener('scroll',()=>{
  header.classList.toggle('stuck',scrollY>10);stmtUpdate();
  const h=document.documentElement.scrollHeight-innerHeight;sb.style.width=(h>0?scrollY/h*100:0)+'%';
},{passive:true});

const glow=$('#cursorGlow');
if(matchMedia('(pointer:fine)').matches){
  addEventListener('pointermove',e=>{glow.style.opacity=1;glow.style.transform=`translate(${e.clientX-260}px,${e.clientY-260}px)`},{passive:true});
}

renderFooter();
route();
</script>
</body>
